<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP ELI IDIOMAS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 24px; }
    p { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
    .status { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
    .connected { background: #e8f8f5; color: #2e7d32; }
    .disconnected { background: #ffebee; color: #c62828; }
    button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.3s; }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>

  <div class="card">
    <h1>APP ELI IDIOMAS</h1>
    <p>Plataforma de práctica e intercambio</p>
    
    <div id="status" class="status disconnected">Conectando al servidor...</div>

    <button onclick="probarConexion()">Enviar saludo al servidor</button>
  </div>

  <!-- Conexión a Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusDiv = document.getElementById('status');

    socket.on('connect', () => {
      statusDiv.textContent = 'Conectado en tiempo real';
      statusDiv.className = 'status connected';
    });

    socket.on('disconnect', () => {
      statusDiv.textContent = 'Desconectado';
      statusDiv.className = 'status disconnected';
    });

    // Escuchar respuesta del servidor
    socket.on('respuesta_servidor', (mensaje) => {
      alert(mensaje);
    });

    function probarConexion() {
      // Enviar evento de saludo
      socket.emit('enviar_saludo', '¡Hola desde el cliente!');
    }
  </script>

</body>
</html>
