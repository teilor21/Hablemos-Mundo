<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP ELI IDIOMAS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121824; color: #e1e6ed; display: flex; height: 100vh; overflow: hidden; }
    
    /* Panel lateral */
    .sidebar { width: 280px; background-color: #1a2232; border-right: 1px solid #2a3447; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #2a3447; }
    .sidebar-header h2 { font-size: 18px; color: #ffffff; }
    .user-list { list-style: none; padding: 10px; overflow-y: auto; flex: 1; }
    .user-item { padding: 12px; border-radius: 8px; margin-bottom: 5px; background-color: #253046; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .badge { background: #0084ff; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    /* Área principal de chat */
    .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #151c2c; }
    .chat-header { padding: 20px; background-color: #1a2232; border-bottom: 1px solid #2a3447; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .message { max-width: 65%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .message.received { background-color: #253046; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message.sent { background-color: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message .sender { font-size: 11px; color: #a0aec0; margin-bottom: 4px; display: block; }
    .message.sent .sender { color: #d0e4ff; }

    /* Caja para escribir */
    .input-area { padding: 15px 20px; background-color: #1a2232; border-top: 1px solid #2a3447; display: flex; gap: 10px; }
    .input-area input { flex: 1; background-color: #253046; border: 1px solid #344460; padding: 12px 16px; border-radius: 8px; color: white; outline: none; font-size: 14px; }
    .input-area button { background-color: #0084ff; border: none; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .input-area button:hover { background-color: #006bce; }
  </style>
</head>
<body>

  <!-- Barra Lateral -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Contactos</h2>
      <small id="user-count" style="color: #0084ff;">0 activos</small>
    </div>
    <ul class="user-list" id="users-list"></ul>
  </div>

  <!-- Área de Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <h3 id="chat-title">APP ELI IDIOMAS</h3>
      <p style="font-size: 12px; color: #a0aec0;">Salón global de intercambio</p>
    </div>

    <div class="messages-container" id="messages"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
      <button onclick="enviarMensaje()">Enviar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let miNombre = prompt("Ingresa tu nombre para entrar a APP ELI IDIOMAS:") || "Usuario";

    socket.on('connect', () => {
      socket.emit('registrar_usuario', miNombre);
    });

    socket.on('actualizar_usuarios', (usuarios) => {
      const usersList = document.getElementById('users-list');
      const userCount = document.getElementById('user-count');
      usersList.innerHTML = '';
      
      userCount.textContent = `${usuarios.length} activos`;

      usuarios.forEach(u => {
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `<span>${u.nombre} ${u.id === socket.id ? '(Tú)' : ''}</span> <span class="badge">En línea</span>`;
        usersList.appendChild(li);
      });
    });

    socket.on('recibir_mensaje', (datos) => {
      const messagesContainer = document.getElementById('messages');
      const esMio = datos.emisorId === socket.id;
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${esMio ? 'sent' : 'received'}`;
      msgDiv.innerHTML = `
        <span class="sender">${esMio ? 'Tú' : datos.emisorNombre}</span>
        <div>${datos.texto}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    function enviarMensaje() {
      const input = document.getElementById('message-input');
      const texto = input.value.trim();
      
      if (texto !== '') {
        socket.emit('enviar_mensaje', { texto: texto });
        input.value = '';
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        enviarMensaje();
      }
    }
  </script>
</body>
</html>
