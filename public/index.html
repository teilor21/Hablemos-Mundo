<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hablemos Mundo - Chat Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- ENCABEZADO PRINCIPAL -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🌐</span>
      <div>
        <h1 class="font-bold text-base text-yellow-400">Hablemos Mundo</h1>
        <p class="text-[11px] text-slate-400" id="my-profile-info">Cargando perfil...</p>
      </div>
    </div>
    
    <button onclick="showVipModal()" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-yellow-500/20">
      👑 Ser VIP
    </button>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden">

    <!-- BARRA LATERAL DE PERFIL Y CONTACTOS -->
    <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
      
      <!-- PERFIL DEL USUARIO -->
      <div class="p-3 bg-slate-950/60 border-b border-slate-800 flex flex-col gap-2.5">
        <div class="flex items-center gap-3">
          <label for="avatar-input" class="relative group cursor-pointer" title="Cambiar foto de perfil">
            <div id="my-avatar-preview" class="w-10 h-10 rounded-full bg-slate-800 border-2 border-yellow-500/60 flex items-center justify-center text-yellow-400 font-bold overflow-hidden shadow">
              👤
            </div>
            <div class="absolute inset-0 bg-black/50 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] text-white font-bold transition">
              📷
            </div>
          </label>
          <input type="file" id="avatar-input" accept="image/*" class="hidden">

          <div class="flex-1 min-w-0">
            <input type="text" id="username-input" placeholder="Tu nombre..." class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-yellow-500 font-medium">
          </div>
        </div>

        <!-- SELECCIÓN DE NACIONALIDAD -->
        <div>
          <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Tu Nacionalidad</label>
          <select id="country-select" onchange="updateProfileInfo()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-yellow-500">
            <option value="🇨🇴 Colombia">🇨🇴 Colombia</option>
            <option value="🇲🇽 México">🇲🇽 México</option>
            <option value="🇪🇸 España">🇪🇸 España</option>
            <option value="🇦🇷 Argentina">🇦🇷 Argentina</option>
            <option value="🇺🇸 EE.UU.">🇺🇸 EE.UU.</option>
            <option value="🇧🇷 Brasil">🇧🇷 Brasil</option>
            <option value="🇫🇷 Francia">🇫🇷 Francia</option>
            <option value="🇩🇪 Alemania">🇩🇪 Alemania</option>
            <option value="🇮🇹 Italia">🇮🇹 Italia</option>
            <option value="🌎 Otro">🌎 Otro país</option>
          </select>
        </div>

        <!-- IDIOMAS A APRENDER (MÁXIMO 3 EN CUENTA GRATUITA) -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[10px] text-slate-400 font-bold uppercase">Quiero aprender (Máx. 3)</label>
            <span id="languages-count" class="text-[10px] text-yellow-400 font-bold">0/3</span>
          </div>
          <div id="languages-container" class="grid grid-cols-2 gap-1 text-[11px]">
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇺🇸 Inglés" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇺🇸 Inglés
            </label>
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇫🇷 Francés" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇫🇷 Francés
            </label>
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇮🇹 Italiano" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇮🇹 Italiano
            </label>
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇩🇪 Alemán" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇩🇪 Alemán
            </label>
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇧🇷 Portugués" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇧🇷 Portugués
            </label>
            <label class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded border border-slate-800 cursor-pointer hover:bg-slate-800">
              <input type="checkbox" value="🇨🇳 Chino" onchange="handleLanguageSelect(this)" class="lang-checkbox accent-yellow-500"> 🇨🇳 Chino
            </label>
          </div>
        </div>
      </div>

      <!-- AJUSTES (ARCHIVADOS Y BLOQUEADOS) -->
      <div class="p-2.5 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between gap-2">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Ajustes</span>
        <div class="flex gap-1.5">
          <button onclick="toggleArchivedModal()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-yellow-400 border border-slate-700 rounded-md text-[11px] font-semibold transition flex items-center gap-1">
            📁 Archivados <span id="archived-count" class="bg-yellow-500/20 text-yellow-300 px-1 rounded text-[10px]">0</span>
          </button>
          <button onclick="toggleBlockedListModal()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-red-400 border border-slate-700 rounded-md text-[11px] font-semibold transition flex items-center gap-1">
            🚫 Bloqueados
          </button>
        </div>
      </div>

      <!-- LISTA DE USUARIOS EN LÍNEA -->
      <div class="p-2.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 flex justify-between items-center bg-slate-950/30">
        <span>Usuarios en línea</span>
        <span id="users-count" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[10px]">0</span>
      </div>

      <div id="users-list" class="flex-1 overflow-y-auto p-2 space-y-1.5">
        <!-- Se llena con sockets -->
      </div>
    </aside>

    <!-- ÁREA DE CHAT CON UN CONTACTO -->
    <main class="flex-1 flex flex-col bg-slate-950">

      <!-- HEADER DE CHAT ACTIVO -->
      <div id="chat-header" class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="active-avatar-container" class="relative">
            <div id="active-user-avatar" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-sm text-yellow-400 overflow-hidden">
              👤
            </div>
          </div>
          <div>
            <h3 id="active-user-name" class="text-sm font-semibold text-white">Selecciona un usuario</h3>
            <p id="active-user-status" class="text-[11px] text-slate-400">Haz clic en la lista para iniciar la conversación</p>
          </div>
        </div>

        <!-- ACCIONES (LLAMADAS, ARCHIVAR, BLOQUEAR) -->
        <div class="flex items-center gap-2">
          <button onclick="startCall('audio')" class="p-2 bg-slate-800 hover:bg-slate-700 text-green-400 border border-slate-700 rounded-lg text-xs transition" title="Llamada de Voz">
            📞
          </button>
          <button onclick="startCall('video')" class="p-2 bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700 rounded-lg text-xs transition" title="Videollamada en Alta Calidad">
            📹
          </button>
          <button onclick="archiveCurrentChat()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs transition" title="Archivar chat">
            📥
          </button>
          <button onclick="blockCurrentContact()" class="p-2 bg-red-600/10 hover:bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs transition" title="Bloquear contacto">
            🚫
          </button>
        </div>
      </div>

      <!-- MENSAJES DEL CHAT -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-slate-500 text-xs py-12">
          Selecciona un contacto en la barra lateral para enviar mensajes.
        </div>
      </div>

      <!-- FORMULARIO DE ENVÍO DE MENSAJES -->
      <form id="chat-form" class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <label for="media-input" class="p-2 bg-slate-800 hover:bg-slate-700 text-yellow-400 border border-slate-700 rounded-lg cursor-pointer transition flex items-center justify-center text-sm" title="Adjuntar foto o video">
          📎
        </label>
        <input type="file" id="media-input" accept="image/*,video/*" class="hidden">

        <button type="button" id="mic-btn" onclick="toggleVoiceRecord()" class="p-2 bg-slate-800 hover:bg-slate-700 text-red-400 border border-slate-700 rounded-lg transition flex items-center justify-center text-sm" title="Grabar nota de voz">
          🎙️
        </button>

        <input id="message-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-yellow-500">
        
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-5 py-2 rounded-lg text-xs transition">
          Enviar
        </button>
      </form>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
